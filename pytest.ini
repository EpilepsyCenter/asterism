[pytest]
# Silence the known-benign small-sample warnings pingouin/scipy emit when a test
# deliberately uses n<4 groups (e.g. the "stats run on subject means" test). Scoped
# to the exact messages so genuine warnings still surface.
filterwarnings =
    ignore:.*less than 4 valid samples.*:UserWarning
    ignore:.*Precision loss occurred.*:RuntimeWarning
    ignore:.*invalid value encountered in multiply.*:RuntimeWarning
    ignore:.*divide by zero encountered in scalar divide.*:RuntimeWarning
    ignore:.*invalid value encountered in divide.*:RuntimeWarning
